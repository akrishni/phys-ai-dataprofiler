name: publish

# Push a version tag to release:  git tag v0.3.1 && git push origin v0.3.1
# The tag must match __version__ in phys_ai_dataprofiler/__init__.py.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and check the package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('phys_ai_dataprofiler/__init__.py').read_text()).group(1))")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match __version__ ${version} (expected tag v${version})"
            exit 1
          fi

      - name: Run all tests (offline)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[mat73,rosbag,dev]"
          python tests/run_all.py

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Must match the environment name entered in the PyPI trusted publisher settings.
    environment:
      name: pypi
      url: https://pypi.org/project/phys-ai-dataprofiler/
    permissions:
      id-token: write   # trusted publishing: PyPI accepts GitHub's OIDC token, no API token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
