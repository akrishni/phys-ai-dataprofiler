[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phys-ai-dataprofiler"
dynamic = ["version"]
description = "Profile robotics and lab datasets on the Hugging Face Hub without downloading them (MCAP, ROS bags, MATLAB, Parquet), and check them against your requirements"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anand Krishniyer", email = "akrishniyer@gmail.com" }]
requires-python = ">=3.10"
keywords = ["robotics", "dataset", "mcap", "rosbag", "ros2", "matlab", "parquet", "lerobot",
            "huggingface", "data-quality", "profiling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = ["huggingface_hub>=1.0", "mcap>=1.0", "numpy", "scipy", "pyarrow>=14", "pyyaml>=6"]

[project.optional-dependencies]
mat73 = ["h5py"]          # MAT v7.3 (HDF5) support; needs Python <= 3.13 for wheels today
rosbag = ["rosbags", "lz4"]   # rosbags writes test bags; lz4 decodes lz4 chunks of unindexed ROS 1 bags
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/akrishni/phys-ai-dataprofiler"
Documentation = "https://github.com/akrishni/phys-ai-dataprofiler#readme"
Issues = "https://github.com/akrishni/phys-ai-dataprofiler/issues"

[project.scripts]
phys-ai-dataprofiler = "phys_ai_dataprofiler.connectors.huggingface:main"

[tool.setuptools.dynamic]
version = { attr = "phys_ai_dataprofiler.__version__" }

[tool.setuptools.packages.find]
include = ["phys_ai_dataprofiler*"]

[tool.setuptools.package-data]
phys_ai_dataprofiler = ["presets/*.yaml"]
